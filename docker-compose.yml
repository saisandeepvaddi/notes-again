services:
  app:
    build: .
    image: note-and-learn
    ports:
      # Bound to loopback: reach it only via the reverse proxy / Cloudflare Tunnel,
      # never directly. The app also verifies the CF Access token as a backstop.
      - "127.0.0.1:8000:8000"
    volumes:
      - db:/data
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db:
