name: notes-again

services:
  app:
    build:
      context: .
    ports:
      # Loopback by default: reach it through a reverse proxy or tunnel.
      # BIND_ADDRESS=0.0.0.0 in .env opens it to other devices on the network.
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      - db:/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "notes-again", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db:
