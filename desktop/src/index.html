<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes Again</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: oklch(0.985 0.004 85);
        --foreground: oklch(0.21 0.012 60);
        --muted: oklch(0.52 0.012 70);
        --primary: oklch(0.52 0.12 152);
        --border: oklch(0.905 0.007 85);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.17 0.006 70);
          --foreground: oklch(0.95 0.006 85);
          --muted: oklch(0.7 0.01 70);
          --primary: oklch(0.72 0.13 152);
          --border: oklch(0.3 0.007 70);
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font:
          14px/1.5 system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 360px;
        padding: 16px;
        text-align: center;
      }
      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }
      p {
        margin: 0;
      }
      .detail {
        color: var(--muted);
        font-size: 12px;
        -webkit-user-select: text;
        user-select: text;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="starting" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Opening your notes</p>
    </main>
    <main id="failed" hidden role="alert">
      <p>Notes Again couldn't start</p>
      <p class="detail" id="failed-detail"></p>
    </main>
    <script>
      window.showStartupError = (message) => {
        document.getElementById("starting").hidden = true;
        document.getElementById("failed-detail").textContent = message;
        document.getElementById("failed").hidden = false;
      };
    </script>
  </body>
</html>
