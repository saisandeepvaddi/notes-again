name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "server/**"
      - "frontend/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf libfuse2

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Take the version from the tag
        if: env.RELEASE == 'true'
        shell: bash
        run: node scripts/ci/set-desktop-version.mjs "${GITHUB_REF_NAME#desktop-v}"

      - name: Build the frontend
        working-directory: frontend
        run: pnpm build

      - name: Build installers
        if: env.RELEASE != 'true'
        working-directory: desktop
        run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: notes-again-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage

      - name: Build and publish the release
        if: env.RELEASE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Notes Again __VERSION__
          releaseBody: |
            Download the installer for your system below. The app checks for updates on its own after that.

            - **macOS** (Apple silicon and Intel): `Notes.Again_<version>_universal.dmg`. The app isn't notarized, so the first time, right-click it in Applications and choose Open (on macOS 15 and later: System Settings > Privacy & Security > Open Anyway).
            - **Windows**: the `.exe` installer (or the `.msi`). SmartScreen may warn about an unrecognized app: choose More info > Run anyway.
            - **Linux**: the `.AppImage` (updates itself), or the `.deb` / `.rpm` for your package manager.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
