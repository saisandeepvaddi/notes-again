name: Docker and backups

on:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image and Litestream round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: notes-again:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Doctor
        run: docker run --rm --entrypoint "" -e AUTH_DISABLED=1 notes-again:ci notes-again doctor
      - name: Litestream round trip
        run: scripts/ci/litestream-roundtrip.sh

  direct:
    name: Direct install and Litestream round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install Litestream like install.sh does
        run: |
          version=$(sed -n 's/^LITESTREAM_VERSION=//p' install.sh)
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/benbjohnson/litestream/releases/download/v$version/litestream-$version-linux-x86_64.tar.gz" \
            | tar -C "$HOME/.local/bin" -xz litestream
          "$HOME/.local/bin/litestream" version
      - name: Build the server
        working-directory: server
        run: cargo build --release --locked
      - name: Litestream round trip through scripts/serve.sh
        run: scripts/ci/serve-litestream-roundtrip.sh
