[package]
name = "notes-again-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "notes_again_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-notification = "2.8.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
getrandom = "0.4.3"
serde_json = "1"
notes-again-server = { path = "../../server" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
