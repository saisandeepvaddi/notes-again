services:
  app:
    build: .
    image: note-and-learn
    ports:
      - "8000:8000"
    volumes:
      - db:/data
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/notes/list >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db:
