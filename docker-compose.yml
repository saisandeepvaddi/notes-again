name: notes-again

services:
  app:
    build:
      context: .
    image: notes-again
    ports:
      # Bound to loopback: reach it only via the reverse proxy / tunnel.
      - "127.0.0.1:8000:8000"
    volumes:
      - db:/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db:
