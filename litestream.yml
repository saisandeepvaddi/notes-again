# Litestream continuously streams SQLite changes to Cloudflare R2 (S3-compatible).
# Credentials come from the environment:
#   LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY  (R2 API token)
# See .env.example for the rest.

dbs:
  - path: ${DB_PATH}
    replicas:
      - type: s3
        bucket: ${R2_BUCKET}
        path: ${R2_PATH}
        endpoint: ${R2_ENDPOINT}
        region: auto
