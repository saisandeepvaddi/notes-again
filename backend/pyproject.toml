[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "firebase-admin>=7.5.0",
    "fsrs>=6.3.2",
    "pyjwt[crypto]>=2.13.0",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.5",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
